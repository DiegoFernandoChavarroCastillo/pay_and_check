services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Dentro de la red de docker-compose, el host de la DB es el nombre
      # del servicio ("db"), no localhost — sobreescribe lo que traiga .env.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/pay_and_check
    depends_on:
      - db
    volumes:
      - .:/app
      # Volumen anónimo: le da al contenedor el .venv ya armado en la imagen
      # (etapa "builder" del Dockerfile) en vez de que el bind mount de arriba
      # lo tape con el directorio del host — y de paso evita que un `uv sync`
      # corriendo como root dentro del contenedor deje el .venv del host con
      # archivos root-owned e ilegibles/borrables para tu usuario.
      - /app/.venv
    # Sin "uv run": la imagen final (multi-stage) no trae uv, solo el venv ya
    # resuelto en PATH. --reload es lo único que la diferencia de producción.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pay_and_check
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:

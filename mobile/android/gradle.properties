# 8G (el valor de la plantilla de Flutter) no cabe en un PC de 12 GB junto al
# compilador de Dart: el build moria por falta de memoria.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin compila dentro del proceso de Gradle en vez de abrir otro Java aparte:
# con el emulador y Docker abiertos no quedaba memoria para ese segundo proceso
# ("Could not connect to Kotlin compile daemon").
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

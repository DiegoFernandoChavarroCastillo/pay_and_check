name: Mobile release

# Al empujar un tag v* (ej. v0.1.0) compila el APK firmado y lo adjunta a un
# GitHub Release: ese enlace es lo que se le pasa a los probadores.
#
# Requiere en el repositorio (Settings > Secrets and variables > Actions):
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Variables: API_BASE_URL (obligatoria), GOOGLE_SERVER_CLIENT_ID (opcional)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: mobile

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Check release configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$API_BASE_URL" || { echo "Falta la variable API_BASE_URL"; exit 1; }
          test -n "$KEYSTORE" || { echo "Falta el secreto ANDROID_KEYSTORE_BASE64"; exit 1; }

      # Sin el keystore propio el APK saldría firmado con una llave de
      # depuración distinta en cada build y no podría actualizar al anterior.
      - name: Restore signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      # Las traducciones (lib/l10n/gen) no se versionan: se generan de los .arb.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          flutter build apk --release \
            --build-name="${TAG#v}" --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          mv build/app/outputs/flutter-apk/app-release.apk "build/pay-and-check-$TAG.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/pay-and-check-${{ github.ref_name }}.apk
          generate_release_notes: true
